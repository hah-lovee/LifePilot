name: life-pilot

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-life_pilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-life_pilot}
      POSTGRES_DB: ${POSTGRES_DB:-life_pilot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-life_pilot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      args:
        BUILD_REF: ${BUILD_REF:-unknown}
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    restart: unless-stopped
    depends_on:
      - backend

  vpn-proxy:
    build:
      context: ../vpn-proxy
      args:
        BUILD_REF: ${BUILD_REF:-unknown}
    restart: unless-stopped
    volumes:
      # Generated by vpn-proxy/generate-config.py; holds subscription
      # credentials, so it is mounted rather than baked into the image.
      - ./xray-config.json:/etc/xray/config.json:ro
    # Deliberately no ports: reachable only from inside this network, which is
    # what keeps an open proxy from being an open proxy.

  voice-bot:
    build:
      context: ../voice-bot
      args:
        BUILD_REF: ${BUILD_REF:-unknown}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Same compose project, so both are reachable by service name.
      LIFEPILOT_API_URL: http://backend:8000
      TELEGRAM_PROXY: ${TELEGRAM_PROXY:-http://vpn-proxy:8889}
    volumes:
      # Filler-word history, on a named volume so it outlives the container.
      - voice_bot_data:/data
      # Whisper and Ollama run on the Hyper-V *host*, whose address changes
      # every time that host reboots. Inside a container `ip route` describes
      # the docker bridge (the VM itself), so we mount the VM's own route table
      # and read the default gateway from there instead — see
      # voice-bot/app/hostgw.py. Read-only, and re-read on a TTL so a host
      # reboot heals without recreating this container.
      - /proc/net/route:/host/net/route:ro
    depends_on:
      - backend
      - vpn-proxy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  uploads_data:
  voice_bot_data:

# Investments module (existing parser backend) is intentionally not wired in
# yet — it currently runs as its own 3-container stack (vault -> vault-init ->
# api). Once the read API contract is settled, add it here as additional
# services on this same docker network, and the life-pilot backend will call
# it over the internal network rather than the public internet. See
# docs/ARCHITECTURE.md.
